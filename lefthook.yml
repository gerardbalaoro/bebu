glob_matcher: doublestar

pre-commit:
  piped: true
  commands:
    fmt:
      priority: 1
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,scss,less,html,vue,graphql,gql,md,mdx,yml,yaml,toml}"
      run: bunx --no-install oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,vue}"
      run: bunx --no-install oxlint --no-error-on-unmatched-pattern {staged_files}
